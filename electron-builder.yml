appId: me.sevensave.launcher
productName: Sevensave
copyright: © 2026 Sevensave
directories:
  output: release
  buildResources: build
electronLanguages:
  - ru
  - en-US
files:
  - out/**
  - resources/**
  - package.json
# Встроенный каталог с артом: лаунчер работает и без сети.
extraResources:
  - from: catalog
    to: catalog
win:
  icon: build/icon.png
  executableName: Sevensave
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Sevensave
  uninstallDisplayName: Sevensave
  deleteAppDataOnUninstall: false
  # Стабильное имя без версии: сайт ссылается на releases/latest/download/Sevensave-Setup.exe.
  artifactName: Sevensave-Setup.${ext}
mac:
  icon: build/icon.png
  category: public.app-category.games
  # Подписи Apple нет: подписываем ad-hoc, иначе на Apple Silicon macOS называет приложение повреждённым.
  identity: '-'
  hardenedRuntime: false
  # dmg — для сайта (стабильное имя задано в dmg ниже), zip — для самообновления (src/main/updater.ts).
  artifactName: Sevensave-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
dmg:
  title: Sevensave
  artifactName: Sevensave-mac-${arch}.${ext}
publish:
  provider: github
  owner: sevensave
  repo: sevensave
  releaseType: draft
